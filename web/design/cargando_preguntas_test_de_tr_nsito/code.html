<script>
  (function() {
    const messages = [
      'Preparando preguntas del banco oficial de vialidad...',
      'Cargando escenarios de prioridad en intersecciones...',
      'Verificando simbología reglamentaria y preventiva...',
      'Inicializando temporizador de prueba...'
    ];
    let idx = 0;
    const ticker = document.getElementById('status-ticker');
    if (ticker) {
      setInterval(() => {
        idx = (idx + 1) % messages.length;
        ticker.style.opacity = '0';
        ticker.style.transform = 'translateY(2px)';
        ticker.style.transition = 'all 180ms ease';
        setTimeout(() => {
          ticker.textContent = messages[idx];
          ticker.style.opacity = '1';
          ticker.style.transform = 'translateY(0)';
        }, 180);
      }, 2600);
    }
  })();
