<script>
  (function initQuestionViewer() {
    const btnFeedback = document.getElementById('view-feedback-btn');
    const btnIdle = document.getElementById('view-idle-btn');
    const optionA = document.getElementById('option-a-card');
    const optionB = document.getElementById('option-b-card');
    const optionC = document.getElementById('option-c-card');
    const badgeA = document.getElementById('badge-a');
    const badgeB = document.getElementById('badge-b');
    const iconAWrap = document.getElementById('icon-a-wrap');
    const iconBWrap = document.getElementById('icon-b-wrap');
    const tokenA = document.getElementById('token-a');
    const tokenB = document.getElementById('token-b');
    const legalDrawer = document.getElementById('legal-drawer');

    function setFeedbackMode() {
      btnFeedback.className = 'px-space-sm py-0.5 rounded font-label-md text-label-md transition-all bg-surface-container-high text-on-surface font-semibold shadow-xs';
      btnIdle.className = 'px-space-sm py-0.5 rounded font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface';
      
      // Option A: Incorrect evaluated
      optionA.className = 'group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-200 bg-tertiary-container/15 text-tertiary shadow-sm hover:brightness-105';
      tokenA.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-label-lg text-label-lg font-bold bg-tertiary/20 text-tertiary shadow-xs';
      badgeA.classList.remove('hidden');
      iconAWrap.innerHTML = '<span class="material-symbols-outlined text-[18px]">close</span>';
      iconAWrap.className = 'flex-shrink-0 w-7 h-7 rounded-full bg-tertiary/20 flex items-center justify-center text-tertiary';

      // Option B: Correct evaluated
      optionB.className = 'group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-200 bg-secondary-container/20 text-secondary shadow-sm hover:brightness-105';
      tokenB.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-label-lg text-label-lg font-bold bg-secondary/20 text-secondary shadow-xs';
      badgeB.classList.remove('hidden');
      iconBWrap.innerHTML = '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
      iconBWrap.className = 'flex-shrink-0 w-7 h-7 rounded-full bg-secondary/20 flex items-center justify-center text-secondary';

      legalDrawer.classList.remove('hidden');
    }

    function setIdleMode() {
      btnIdle.className = 'px-space-sm py-0.5 rounded font-label-md text-label-md transition-all bg-surface-container-high text-on-surface font-semibold shadow-xs';
      btnFeedback.className = 'px-space-sm py-0.5 rounded font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface';

      // Reset options to neutral un-evaluated state
      [optionA, optionB].forEach((card, idx) => {
        card.className = 'group relative flex items-center justify-between p-space-md rounded-lg cursor-pointer transition-all duration-200 bg-surface-container hover:bg-surface-container-high text-on-surface shadow-xs';
      });

      tokenA.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-label-lg text-label-lg font-bold bg-surface-container-highest text-on-surface-variant shadow-xs';
      tokenB.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-label-lg text-label-lg font-bold bg-surface-container-highest text-on-surface-variant shadow-xs';
      
      badgeA.classList.add('hidden');
      badgeB.classList.add('hidden');

      iconAWrap.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant';
      iconAWrap.innerHTML = '<span class="w-2 h-2 rounded-full bg-transparent group-hover:bg-on-surface-variant/40"></span>';

      iconBWrap.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant';
      iconBWrap.innerHTML = '<span class="w-2 h-2 rounded-full bg-transparent group-hover:bg-on-surface-variant/40"></span>';

      legalDrawer.classList.add('hidden');
    }

    if (btnFeedback && btnIdle) {
      btnFeedback.addEventListener('click', setFeedbackMode);
      btnIdle.addEventListener('click', setIdleMode);
    }
  })();
